<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undecided voters</title>
<style>body{margin:0;padding:16px;background:#fff}</style>
</head>
<body>
<!--
  The Times poll tracker: undecided voters, and which way they lean.
  Paste this whole file into a custom HTML block, or use widget/undecided.html as an iframe.
  It reads outputs/undecided.json live from GitHub (data-src on #tt-poll-undecided below). ASCII only.
-->
<link rel="preconnect" href="https://static.dwcdn.net" crossorigin>

<style>
  @font-face { font-family: "Times Roboto"; font-style: normal; font-weight: 400; font-display: swap;
    src: url("https://static.dwcdn.net/custom/themes/thetimes/TimesRoboto-Regular.woff2") format("woff2"),
         url("https://static.dwcdn.net/custom/themes/thetimes/TimesRoboto-Regular.woff") format("woff"); }
  @font-face { font-family: "Times Roboto"; font-style: normal; font-weight: 500; font-display: swap;
    src: url("https://static.dwcdn.net/custom/themes/thetimes/TimesRoboto-Medium.woff2") format("woff2"),
         url("https://static.dwcdn.net/custom/themes/thetimes/TimesRoboto-Medium.woff") format("woff"); }
  /* On thetimes.com the page's own "Times Modern" (bold) and "Times Digital W04 Regular" are used first.
     Those files are served only to Times sites, so elsewhere the public Times Modern Regular stands in. */
  @font-face { font-family: "TT Times Modern"; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url("https://static.dwcdn.net/custom/themes/thetimes/TimesModern-Regular/TIMESMODERN-REGULAR.woff2") format("woff2"),
         url("https://static.dwcdn.net/custom/themes/thetimes/TimesModern-Regular/TIMESMODERN-REGULAR.woff") format("woff"); }
  #tt-poll-undecided {
    --tt-ink: #000; --tt-label: #191919; --tt-muted: #717171; --tt-border: #8c8c8c; --tt-rule: #e4e4e4; --tt-line: #3d3d3d;
    --tt-head: "Times Modern", "TimesModern-Bold", "TT Times Modern", Georgia, "Times New Roman", serif;
    --tt-serif: "Times Digital W04 Regular", "TimesDigitalW04-Regular", "Times Digital", Georgia, "Times New Roman", serif;
    --tt-sans: "Times Roboto", Roboto, "Roboto-Regular", "Helvetica Neue", Arial, sans-serif;
    position: relative; background: #fff; color: var(--tt-ink); font-family: var(--tt-sans); max-width: 980px; margin: 0 auto;
    padding: 0; box-sizing: border-box; -webkit-text-size-adjust: 100%;
  }
  #tt-poll-undecided *, #tt-poll-undecided *::before, #tt-poll-undecided *::after { box-sizing: border-box; }
  #tt-poll-undecided .tt-title { margin: 0 0 4px; padding: 0; font-family: var(--tt-head); font-size: 24px; font-weight: 700; line-height: 28px; color: var(--tt-ink); }
  #tt-poll-undecided .tt-sub { margin: 0 0 14px; font-family: var(--tt-serif); font-size: 16px; line-height: 22px; color: var(--tt-ink); }
  #tt-poll-undecided .tt-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
  #tt-poll-undecided.tt-wide .tt-main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
  #tt-poll-undecided .tt-label { margin: 0 0 4px; min-height: 26px; display: flex; align-items: center; font-size: 15px; font-weight: 500; line-height: 20px; color: var(--tt-label); }
  #tt-poll-undecided .tt-chart { position: relative; }
  #tt-poll-undecided .tt-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  #tt-poll-undecided .tt-tip { position: absolute; top: 6px; display: none; pointer-events: none; background: #fff; border: 1px solid var(--tt-border);
    padding: 6px 9px; font-size: 13px; line-height: 19px; white-space: nowrap; z-index: 3; }
  #tt-poll-undecided .tt-tip b { font-weight: 500; }
  #tt-poll-undecided .tt-rows { margin: 0; padding: 0; list-style: none; }
  #tt-poll-undecided .tt-row { padding: 8px 0 10px; border-top: 1px solid var(--tt-rule); }
  #tt-poll-undecided .tt-row:last-child { border-bottom: 1px solid var(--tt-rule); }
  #tt-poll-undecided .tt-who { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 500; line-height: 18px; margin: 0 0 6px; }
  #tt-poll-undecided .tt-who span { font-size: 12px; font-weight: 400; color: var(--tt-muted); }
  #tt-poll-undecided .tt-stack { display: flex; height: 30px; width: 100%; gap: 2px; }
  #tt-poll-undecided .tt-seg { height: 100%; min-width: 0; display: flex; align-items: center; justify-content: center; overflow: hidden;
    font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #tt-poll-undecided .tt-key { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 10px 0 0; font-size: 12px; line-height: 16px; color: var(--tt-label); }
  #tt-poll-undecided .tt-key i { display: inline-block; width: 9px; height: 9px; margin-right: 4px; vertical-align: -1px; }
  #tt-poll-undecided .tt-still { margin: 10px 0 0; font-family: var(--tt-serif); font-size: 15px; line-height: 21px; }
  #tt-poll-undecided.tt-narrow .tt-title { font-size: 22px; line-height: 26px; }
  #tt-poll-undecided.tt-narrow .tt-sub { font-size: 15px; line-height: 20px; margin-bottom: 12px; }
  #tt-poll-undecided.tt-narrow .tt-who { flex-direction: column; gap: 1px; }
</style>

<div id="tt-poll-undecided"
     data-src="https://raw.githubusercontent.com/times/times-poll-tracker/main/outputs/undecided.json">
  <h2 class="tt-title" data-tt="head">Undecided voters</h2>
  <p class="tt-sub" data-tt="sub">Loading the latest polls&hellip;</p>
  <div class="tt-main">
    <div>
      <p class="tt-label">Undecided, share of people who would vote</p>
      <div class="tt-chart" data-tt="chart"><div class="tt-tip" data-tt="tip"></div></div>
    </div>
    <div>
      <p class="tt-label" data-tt="leanhead">Which way the undecided lean when pushed</p>
      <ul class="tt-rows" data-tt="rows"></ul>
      <div class="tt-key" data-tt="key"></div>
      <p class="tt-still" data-tt="still"></p>
    </div>
  </div>
</div>

<script>
(function () {
  var root = document.getElementById('tt-poll-undecided');
  if (!root) return;
  var $ = function (k) { return root.querySelector('[data-tt="' + k + '"]'); };
  var q = new URLSearchParams(location.search);
  var SRC = q.get('data') || root.getAttribute('data-src');
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var APOS = '\u2019';
  var NAMES = { ipsos: 'Ipsos', moreincommon: 'More in Common', bmg: 'BMG', opinium: 'Opinium', yougov: 'YouGov', findoutnow: 'Find Out Now' };
  var ORDER = ['LAB', 'CON', 'REF', 'LD', 'GRN'];
  var DARK_TEXT = { REF: 1, LD: 1, OTH: 1 };
  var WIDE = 680, NARROW = 560;
  var D, lastW = 0;

  function pd(s) { var p = s.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
  function fdate(s, yr) { var d = pd(s); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + (yr ? ' ' + d.getUTCFullYear() : ''); }
  function party(code) { return D.parties.filter(function (p) { return p.code === code; })[0]; }
  function colour(code) { return code === 'OTH' ? '#b9b9b9' : party(code).colour; }
  var WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
  function word(n) { return n < 10 ? WORDS[n] : String(n); }   // Times style: words for one to nine
  function list(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }

  function head() {
    var now = D.latest, then = D.year_ago, r = Math.round(now), a = Math.round(100 / now), b = Math.round(100 / then);
    $('head').textContent = 'About one in ' + word(a) + ' voters ' + (a === b ? 'are undecided' :
      'are undecided, ' + (a > b ? 'down' : 'up') + ' from one in ' + word(b) + ' a year ago');
    $('sub').textContent = r + '% of people who would vote don' + APOS + 't yet know who for, against ' + Math.round(then) +
      '% a year ago. From the Times poll average of ' + word(D.pollsters.length) + ' pollsters' + APOS + ' first voting intention question';
  }
  function chart() {
    var box = $('chart'), tip = $('tip'), W = box.clientWidth;
    if (!W) return;
    var small = W < 520, H = W < 420 ? 200 : 240, padL = 28, padR = 52, padT = 10, padB = 24;
    var ds = D.dates, n = ds.length, vals = D.series, t0 = pd(ds[0]).getTime(), t1 = pd(ds[n - 1]).getTime();
    var lo = 0, hi = Math.ceil((Math.max.apply(null, vals) + 2) / 5) * 5;
    function X(t) { return padL + (t - t0) / ((t1 - t0) || 1) * (W - padL - padR); }
    function Y(v) { return padT + (hi - v) / (hi - lo) * (H - padT - padB); }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Line chart of the share of voters who are undecided, ' + fdate(ds[0], true) + ' to ' + fdate(ds[n - 1], true) + '">';
    for (var g = lo; g <= hi; g += 5) {
      s += '<line x1="' + padL + '" x2="' + (W - padR + 4) + '" y1="' + Y(g) + '" y2="' + Y(g) + '" stroke="' + (g === lo ? '#000' : '#e4e4e4') + '"/>' +
        '<text x="' + (padL - 6) + '" y="' + (Y(g) + 4) + '" text-anchor="end" font-size="12" fill="#717171" font-family="Times Roboto, Roboto, Arial, sans-serif">' + g + (g === hi ? '%' : '') + '</text>';
    }
    var d0 = pd(ds[0]), d1 = pd(ds[n - 1]), step = small ? 6 : 3;
    for (var m = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1)); m <= d1; m = new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth() + 1, 1))) {
      if (m.getUTCMonth() % step) continue;
      s += '<line x1="' + X(m.getTime()) + '" x2="' + X(m.getTime()) + '" y1="' + Y(lo) + '" y2="' + (Y(lo) + 4) + '" stroke="#000"/>' +
        '<text x="' + X(m.getTime()) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="12" fill="#717171" font-family="Times Roboto, Roboto, Arial, sans-serif">' +
        MONTHS[m.getUTCMonth()] + (m.getUTCMonth() < step ? ' ' + m.getUTCFullYear() : '') + '</text>';
    }
    s += '<polyline points="' + vals.map(function (v, i) { return X(pd(ds[i]).getTime()).toFixed(1) + ',' + Y(v).toFixed(1); }).join(' ') +
      '" fill="none" stroke="#3d3d3d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + X(t1) + '" cy="' + Y(vals[n - 1]) + '" r="4" fill="#3d3d3d" stroke="#fff" stroke-width="1.5"/>' +
      '<text x="' + (X(t1) + 9) + '" y="' + (Y(vals[n - 1]) + 4) + '" font-size="13" font-weight="500" fill="#000" font-family="Times Roboto, Roboto, Arial, sans-serif">' + vals[n - 1].toFixed(1) + '%</text>';
    s += '<line data-tt="x" y1="' + padT + '" y2="' + (H - padB) + '" stroke="#717171" stroke-dasharray="2 3" visibility="hidden"/>' +
      '<rect data-tt="hit" x="' + padL + '" y="' + padT + '" width="' + (W - padL - padR) + '" height="' + (H - padT - padB) + '" fill="transparent"/></svg>';
    box.innerHTML = s; box.appendChild(tip);
    var hit = box.querySelector('[data-tt="hit"]'), xl = box.querySelector('[data-tt="x"]');
    function move(ev) {
      var r = box.getBoundingClientRect(), cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      var t = t0 + (cx - padL) / (W - padL - padR) * (t1 - t0), best = 0, bd = Infinity;
      ds.forEach(function (d, i) { var dd = Math.abs(pd(d).getTime() - t); if (dd < bd) { bd = dd; best = i; } });
      var x = X(pd(ds[best]).getTime());
      xl.setAttribute('x1', x); xl.setAttribute('x2', x); xl.setAttribute('visibility', 'visible');
      tip.innerHTML = '<b>' + (best === n - 1 ? 'Latest, ' : 'Week to ') + fdate(ds[best], true) + '</b><br>' + vals[best].toFixed(1) + '% undecided';
      tip.style.display = 'block';
      tip.style.left = Math.min(Math.max(0, x + 10), W - tip.offsetWidth) + 'px';
    }
    function out() { tip.style.display = 'none'; xl.setAttribute('visibility', 'hidden'); }
    hit.addEventListener('mousemove', move); hit.addEventListener('mouseleave', out);
    hit.addEventListener('touchstart', move, { passive: true }); hit.addEventListener('touchmove', move, { passive: true }); hit.addEventListener('touchend', out);
  }
  function bar(v) {
    var tot = 0, h = '';
    ORDER.concat(['OTH']).forEach(function (k) { tot += Math.max(0, v[k] || 0); });
    ORDER.concat(['OTH']).forEach(function (k) {
      var w = Math.max(0, v[k] || 0) / tot * 100;
      h += '<div class="tt-seg" title="' + (k === 'OTH' ? 'Other' : party(k).name) + ' ' + w.toFixed(1) + '%" style="flex:0 0 calc(' + w.toFixed(2) + '% - 2px);background:' +
        colour(k) + ';color:' + (DARK_TEXT[k] ? '#000' : '#fff') + '">' + Math.round(w) + '</div>';
    });
    return '<div class="tt-stack">' + h + '</div>';
  }
  function lean() {
    var L = D.lean_now;
    if (!L) { $('rows').innerHTML = ''; return; }
    var who = list(D.lean_pollsters.map(function (f) { return NAMES[f] || f; }));
    $('rows').innerHTML =
      '<li class="tt-row"><div class="tt-who">Undecided voters<span>' + who + ', past ' + word(D.lean_months) + ' months</span></div>' + bar(L.lean) + '</li>' +
      '<li class="tt-row"><div class="tt-who">All voters<span>Times poll average</span></div>' + bar(D.all_voters) + '</li>';
    [].forEach.call($('rows').querySelectorAll('.tt-seg'), function (s) { if (s.scrollWidth > s.clientWidth + 1 || s.clientWidth < 22) s.textContent = ''; });
    $('key').innerHTML = ORDER.concat(['OTH']).map(function (k) {
      return '<span><i style="background:' + colour(k) + '"></i>' + (k === 'OTH' ? 'Other' : party(k).name) + '</span>';
    }).join('');
    $('still').textContent = Math.round(L.still_undecided) + '% of the undecided still can' + APOS + 't choose a party when pushed.';
  }
  function size() {
    var w = root.clientWidth;
    root.classList.toggle('tt-wide', w >= WIDE); root.classList.toggle('tt-narrow', w < NARROW);
  }
  function render() { size(); head(); chart(); lean(); }
  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { if (D && root.clientWidth !== lastW) { lastW = root.clientWidth; size(); chart(); lean(); } }, 120);
  });
  fetch(SRC, { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) { D = j; lastW = root.clientWidth; render(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(lean); })
    .catch(function () { $('sub').textContent = 'The poll tracker couldn' + APOS + 't load just now.'; });
})();
</script>

</body>
</html>
