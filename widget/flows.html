<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where 2024 voters have gone</title>
<style>body{margin:0;padding:16px;background:#fff}</style>
</head>
<body>
<!--
  The Times poll tracker: where 2024 voters have gone (Sankey).
  Paste this whole file into a custom HTML block, or use widget/flows.html as an iframe.
  It reads outputs/groups.json live from GitHub (data-src on #tt-poll-flows below). ASCII only.
  Left: how people voted in 2024 (the five main parties, sized by their GB vote share). Right: how they would
  vote now, from the Times average among each party's 2024 voters.
-->
<link rel="preconnect" href="https://static.dwcdn.net" crossorigin>

<style>
  @font-face { font-family: "Times Roboto"; font-style: normal; font-weight: 400; font-display: swap;
    src: url("https://static.dwcdn.net/custom/themes/thetimes/TimesRoboto-Regular.woff2") format("woff2"),
         url("https://static.dwcdn.net/custom/themes/thetimes/TimesRoboto-Regular.woff") format("woff"); }
  @font-face { font-family: "Times Roboto"; font-style: normal; font-weight: 500; font-display: swap;
    src: url("https://static.dwcdn.net/custom/themes/thetimes/TimesRoboto-Medium.woff2") format("woff2"),
         url("https://static.dwcdn.net/custom/themes/thetimes/TimesRoboto-Medium.woff") format("woff"); }
  /* On thetimes.com the page's own "Times Modern" (bold) and "Times Digital W04 Regular" are used first.
     Those files are served only to Times sites, so elsewhere the public Times Modern Regular stands in. */
  @font-face { font-family: "TT Times Modern"; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url("https://static.dwcdn.net/custom/themes/thetimes/TimesModern-Regular/TIMESMODERN-REGULAR.woff2") format("woff2"),
         url("https://static.dwcdn.net/custom/themes/thetimes/TimesModern-Regular/TIMESMODERN-REGULAR.woff") format("woff"); }
  #tt-poll-flows {
    --tt-ink: #000; --tt-label: #191919; --tt-muted: #717171; --tt-border: #8c8c8c; --tt-rule: #e4e4e4;
    --tt-head: "Times Modern", "TimesModern-Bold", "TT Times Modern", Georgia, "Times New Roman", serif;
    --tt-serif: "Times Digital W04 Regular", "TimesDigitalW04-Regular", "Times Digital", Georgia, "Times New Roman", serif;
    --tt-sans: "Times Roboto", Roboto, "Roboto-Regular", "Helvetica Neue", Arial, sans-serif;
    position: relative; background: #fff; color: var(--tt-ink); font-family: var(--tt-sans); max-width: 980px; margin: 0 auto;
    padding: 0; box-sizing: border-box; -webkit-text-size-adjust: 100%;
  }
  #tt-poll-flows *, #tt-poll-flows *::before, #tt-poll-flows *::after { box-sizing: border-box; }
  #tt-poll-flows .tt-title { margin: 0 0 4px; padding: 0; font-family: var(--tt-head); font-size: 24px; font-weight: 700; line-height: 28px; color: var(--tt-ink); }
  #tt-poll-flows .tt-sub { margin: 0 0 14px; font-family: var(--tt-serif); font-size: 16px; line-height: 22px; color: var(--tt-ink); }
  #tt-poll-flows .tt-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 26px; margin: 0 0 8px; }
  #tt-poll-flows .tt-toggle { display: inline-flex; border: 1px solid var(--tt-border); }
  #tt-poll-flows .tt-toggle button { font-family: var(--tt-sans); font-size: 12px; line-height: 16px; border: 0; border-radius: 0; background: #fff;
    color: var(--tt-label); padding: 4px 8px; margin: 0; cursor: pointer; white-space: nowrap; }
  #tt-poll-flows .tt-toggle button[aria-pressed="true"] { background: var(--tt-ink); color: #fff; }
  #tt-poll-flows .tt-chart { position: relative; }
  #tt-poll-flows .tt-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  #tt-poll-flows .tt-chart path { transition: fill-opacity .15s; cursor: default; }
  #tt-poll-flows .tt-tip { position: absolute; display: none; pointer-events: none; background: #fff; border: 1px solid var(--tt-border);
    padding: 6px 9px; font-size: 13px; line-height: 18px; max-width: 240px; z-index: 3; }
  #tt-poll-flows .tt-tip b { font-weight: 500; }
  #tt-poll-flows.tt-narrow .tt-title { font-size: 22px; line-height: 26px; }
  #tt-poll-flows.tt-narrow .tt-sub { font-size: 15px; line-height: 20px; margin-bottom: 12px; }
</style>

<div id="tt-poll-flows"
     data-src="https://raw.githubusercontent.com/times/times-poll-tracker/main/outputs/groups.json">
  <h2 class="tt-title" data-tt="head">Where 2024 voters have gone</h2>
  <p class="tt-sub" data-tt="sub">Loading the latest polls&hellip;</p>
  <div class="tt-bar">
    <div class="tt-toggle" role="group" aria-label="When" data-tt="when">
      <button type="button" data-back="0" aria-pressed="true">Now</button>
      <button type="button" data-back="26" aria-pressed="false">6 months ago</button>
      <button type="button" data-back="52" aria-pressed="false">A year ago</button>
    </div>
  </div>
  <div class="tt-chart" data-tt="chart"><div class="tt-tip" data-tt="tip"></div></div>
</div>

<script>
(function () {
  var root = document.getElementById('tt-poll-flows');
  if (!root) return;
  var $ = function (k) { return root.querySelector('[data-tt="' + k + '"]'); };
  var q = new URLSearchParams(location.search);
  var SRC = q.get('data') || root.getAttribute('data-src');
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var APOS = '\u2019';
  var NAME = { LAB: 'Labour', CON: 'Conservative', REF: 'Reform', LD: 'Lib Dem', GRN: 'Green', OTH: 'Other' };
  var SHORT = { LAB: 'Lab', CON: 'Con', REF: 'Ref', LD: 'LD', GRN: 'Grn', OTH: 'Other' };
  var ORDER = ['LAB', 'CON', 'REF', 'LD', 'GRN'], RIGHT = ORDER.concat(['OTH']);
  var NARROW = 560;
  var D, back = 0, lastW = 0;

  function pd(s) { var p = s.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
  function fdate(s) { var d = pd(s); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
  function party(code) { return D.parties.filter(function (p) { return p.code === code; })[0]; }
  function colour(code) { return code === 'OTH' ? '#b9b9b9' : party(code).colour; }
  function tcolour(code) { return code === 'OTH' ? '#717171' : party(code).text_colour; }
  function group(code) { return D.groups.filter(function (g) { return g.id === 'ge2024:' + code; })[0]; }
  // shares of a 2024 party's voters at a point in time, scaled to 100 (each line is smoothed separately)
  function at(g, b) {
    var i = D.dates.length - 1 - b, v = {}, tot = 0;
    RIGHT.forEach(function (k) { var x = g.series[k] ? g.series[k][i] : null; v[k] = Math.max(0, x || 0); tot += v[k]; });
    RIGHT.forEach(function (k) { v[k] = tot ? v[k] / tot * 100 : 0; });
    return v;
  }

  function head() {
    var best = null;
    ORDER.forEach(function (k) {
      var g = group(k); if (!g) return;
      var now = at(g, 0)[k], then = at(g, 52)[k];
      if (!best || Math.abs(now - then) > Math.abs(best.now - best.then)) best = { k: k, now: now, then: then };
    });
    var r = Math.round(best.now), t = Math.round(best.then), sing = best.k === 'LAB' || best.k === 'REF';
    var who = { LAB: 'Labour', CON: 'The Conservatives', REF: 'Reform', LD: 'The Lib Dems', GRN: 'The Greens' }[best.k];
    $('head').textContent = who + (sing ? ' is' : ' are') + ' keeping ' + r + '% of ' + (sing ? 'its' : 'their') + ' 2024 voters, ' +
      (r < t ? 'down' : 'up') + ' from ' + t + '% a year ago';
    $('sub').textContent = 'How people who voted for the five main parties at the 2024 general election would vote now, ' +
      'from the Times poll average. Bands are sized by numbers of voters';
  }
  function chart() {
    var box = $('chart'), tip = $('tip'), W = box.clientWidth;
    if (!W) return;
    var narrow = root.classList.contains('tt-narrow');
    var H = narrow ? 440 : 480, LW = narrow ? 62 : 150, RW = narrow ? 62 : 150, NW = 10, GAP = 10, padT = 26, padB = 4;
    var x0 = LW, x1 = W - RW - NW;
    var w24 = D.ge2024_gb, flows = {}, inflow = {}, total = 0;
    RIGHT.forEach(function (t) { inflow[t] = 0; });
    ORDER.forEach(function (s) {
      var g = group(s); if (!g) return;
      flows[s] = at(g, back); total += w24[s];
      RIGHT.forEach(function (t) { inflow[t] += w24[s] * flows[s][t] / 100; });
    });
    // one scale for both columns: the column with more nodes (more gaps) sets it
    var k = Math.min((H - padT - padB - GAP * (ORDER.length - 1)) / total, (H - padT - padB - GAP * (RIGHT.length - 1)) / total);
    function column(keys, size) {
      var y = {}, h = 0;
      keys.forEach(function (key) { h += size(key) * k; });
      var cur = padT + (H - padT - padB - h - GAP * (keys.length - 1)) / 2;
      keys.forEach(function (key) { y[key] = { top: cur, h: size(key) * k }; cur += size(key) * k + GAP; });
      return y;
    }
    var L = column(ORDER, function (s) { return w24[s]; }), R = column(RIGHT, function (t) { return inflow[t]; });
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Flow chart of how 2024 voters for each main party would vote now">';
    var outY = {}, inY = {}, xm = (x0 + NW + x1) / 2;
    ORDER.forEach(function (a) { outY[a] = L[a].top; });
    RIGHT.forEach(function (b) { inY[b] = R[b].top; });
    // links: sources top to bottom; within a source, targets in the right-hand order (so bands don't cross at the nodes)
    ORDER.forEach(function (a) {
      if (!flows[a]) return;
      RIGHT.forEach(function (b) {
        var v = w24[a] * flows[a][b] / 100, h = v * k;
        if (h <= 0.05) return;
        var ys = outY[a], yt = inY[b];
        outY[a] += h; inY[b] += h;
        s += '<path data-a="' + a + '" data-b="' + b + '" data-v="' + flows[a][b].toFixed(1) + '" fill="' + colour(a) + '" fill-opacity="' + (a === b ? 0.55 : 0.4) + '" d="' +
          'M' + (x0 + NW) + ',' + ys.toFixed(1) + ' C' + xm + ',' + ys.toFixed(1) + ' ' + xm + ',' + yt.toFixed(1) + ' ' + x1 + ',' + yt.toFixed(1) +
          ' L' + x1 + ',' + (yt + h).toFixed(1) + ' C' + xm + ',' + (yt + h).toFixed(1) + ' ' + xm + ',' + (ys + h).toFixed(1) + ' ' + (x0 + NW) + ',' + (ys + h).toFixed(1) + ' Z"/>';
      });
    });
    var font = 'font-family="Times Roboto, Roboto, Roboto-Regular, Arial, sans-serif"';
    // column headings, over the two columns of bars
    s += '<text x="' + (x0 + NW) + '" y="12" text-anchor="end" font-size="12" font-weight="500" fill="#717171" ' + font + '>Voted in 2024</text>' +
      '<text x="' + (narrow ? W : x1) + '" y="12"' + (narrow ? ' text-anchor="end"' : '') + ' font-size="12" font-weight="500" fill="#717171" ' + font + '>' +
      (back ? 'Would vote, ' + fdate(D.dates[D.dates.length - 1 - back]) : 'Would vote now') + '</text>';
    ORDER.forEach(function (a) {
      var n = L[a], cy = n.top + n.h / 2, stay = flows[a] ? Math.round(flows[a][a]) : null;
      s += '<rect x="' + x0 + '" y="' + n.top.toFixed(1) + '" width="' + NW + '" height="' + n.h.toFixed(1) + '" fill="' + colour(a) + '"/>' +
        '<text x="' + (x0 - 8) + '" y="' + (cy - (narrow ? 1 : 2)).toFixed(1) + '" text-anchor="end" font-size="' + (narrow ? 12 : 14) + '" font-weight="500" fill="' + tcolour(a) + '" ' + font + '>' +
        (narrow ? SHORT[a] : NAME[a]) + '</text>' +
        '<text x="' + (x0 - 8) + '" y="' + (cy + (narrow ? 12 : 14)).toFixed(1) + '" text-anchor="end" font-size="' + (narrow ? 11 : 12) + '" fill="#717171" ' + font + '>' +
        (stay == null ? '' : stay + '% stay') + '</text>';
    });
    RIGHT.forEach(function (b) {
      var n = R[b], cy = n.top + n.h / 2;
      s += '<rect x="' + x1 + '" y="' + n.top.toFixed(1) + '" width="' + NW + '" height="' + Math.max(1, n.h).toFixed(1) + '" fill="' + colour(b) + '"/>' +
        '<text x="' + (x1 + NW + 8) + '" y="' + (cy + 4).toFixed(1) + '" font-size="' + (narrow ? 12 : 14) + '" font-weight="500" fill="' + tcolour(b) + '" ' + font + '>' +
        (narrow ? SHORT[b] : NAME[b]) + '</text>';
    });
    box.innerHTML = s + '</svg>'; box.appendChild(tip);
    var paths = box.querySelectorAll('path');
    [].forEach.call(paths, function (p) {
      function show(ev) {
        [].forEach.call(paths, function (o) { o.setAttribute('fill-opacity', o === p ? 0.85 : 0.12); });
        var a = p.getAttribute('data-a'), b = p.getAttribute('data-b'), v = +p.getAttribute('data-v');
        tip.innerHTML = '<b>' + v.toFixed(1) + '%</b> of 2024 ' + NAME[a] + ' voters ' +
          (a === b ? 'would vote ' + NAME[a] + ' again' : b === 'OTH' ? 'would now vote for another party' : 'would now vote ' + NAME[b]) +
          (back ? ' (' + fdate(D.dates[D.dates.length - 1 - back]) + ')' : '');
        tip.style.display = 'block';
        var r = box.getBoundingClientRect(), x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left, y = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
        tip.style.left = Math.min(Math.max(0, x - tip.offsetWidth / 2), W - tip.offsetWidth) + 'px';
        tip.style.top = Math.max(0, y - tip.offsetHeight - 12) + 'px';
      }
      function hide() {
        [].forEach.call(paths, function (o) { o.setAttribute('fill-opacity', o.getAttribute('data-a') === o.getAttribute('data-b') ? 0.55 : 0.4); });
        tip.style.display = 'none';
      }
      p.addEventListener('mousemove', show); p.addEventListener('mouseleave', hide);
      p.addEventListener('touchstart', show, { passive: true });
    });
  }
  function size() { root.classList.toggle('tt-narrow', root.clientWidth < NARROW); }
  function render() { size(); head(); chart(); }

  [].forEach.call($('when').querySelectorAll('button'), function (b) {
    b.addEventListener('click', function () {
      back = +b.getAttribute('data-back');
      [].forEach.call($('when').querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      chart();
    });
  });
  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { if (D && root.clientWidth !== lastW) { lastW = root.clientWidth; size(); chart(); } }, 120);
  });
  fetch(SRC, { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) { D = j; lastW = root.clientWidth; render(); })
    .catch(function () { $('sub').textContent = 'The poll tracker couldn' + APOS + 't load just now.'; });
})();
</script>

</body>
</html>
